name: Android Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build with Docker
        run: |
          docker run --rm -v ${{ github.workspace }}:/home/buildozer/app \
            kivy/buildozer bash -c "
              # Buscamos la ruta del archivo __init__.py de buildozer y eliminamos la llamada a check_root()
              INIT_FILE=\$(find /home/user/.venv -name __init__.py | grep 'buildozer/__init__.py')
              if [ -n \"\$INIT_FILE\" ]; then
                sed -i 's/self.check_root()//g' \"\$INIT_FILE\"
                echo \"Parche aplicado a \$INIT_FILE\"
              fi
              buildozer android debug
            "

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: outfit-ai-apk
          path: bin/*.apk
