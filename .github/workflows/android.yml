name: Android Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            python3-dev \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            libgstreamer1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            libffi-dev \
            libssl-dev \
            libbz2-dev \
            libsqlite3-dev \
            libreadline-dev \
            liblzma-dev \
            autotools-dev \
            m4 \
            openjdk-17-jdk \
            cmake \
            pkg-config \
            autoconf \
            automake \
            libtool

      - name: Fix libtool macro error
        run: |
          # Solución definitiva para el error LT_SYS_SYMBOL_USCORE
          # Creamos una macro vacía para que autoconf no falle al compilar libffi
          sudo mkdir -p /usr/share/aclocal
          echo "macro(LT_SYS_SYMBOL_USCORE([s]) dnl" | sudo tee /usr/share/aclocal/lt_sys_symbol_uscore.m4

      - name: Install Python Build Tools
        run: |
          pip install --user --upgrade pip
          pip install --user buildozer cython==0.29.36 setuptools wheel

      - name: Build with Buildozer
        run: |
          export PATH=$PATH:~/.local/bin
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: outfit-ai-apk
          path: bin/*.apk
